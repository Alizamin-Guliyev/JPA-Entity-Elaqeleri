services:
  postgres:
    image: postgres:16
    container_name: school-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
     - "5432:5432"

    volumes:
      - school-data:/var/lib/postgresql/data

volumes:
  school-data:
